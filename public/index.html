<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibeDJ - Cyber Edition</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Socket.IO Client (CDN oficial com fallback local) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="/socket.io/socket.io.js"><\/script>');
        }
    </script>
    <style>
        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.7);
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #ec4899;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Configuração do Socket.IO com suporte nativo a WebSocket na nuvem (Render)
        const socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            timeout: 20000
        });

        // Extrai o ID de 11 caracteres de qualquer URL do YouTube
        function extractVideoId(url) {
            if (!url) return '';
            const clean = url.trim();
            const regExp = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|live\/))([\w-]{11})/;
            const match = clean.match(regExp);
            if (match && match[1]) {
                return match[1];
            }
            if (/^[\w-]{11}$/.test(clean)) {
                return clean;
            }
            return '';
        }

        // Formata segundos em MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // =========================================================================
        // COMPONENTE DO PLAYER COM CONTROLE EXCLUSIVO DO DJ E AUTO-RESYNC
        // =========================================================================
        function VideoPlayer({ currentTrack, isPlaying, isCurrentDj, onTrackEnded, onRegisterSync }) {
            const playerContainerRef = useRef(null);
            const ytPlayerRef = useRef(null);
            const isReadyRef = useRef(false);
            const [audioBlocked, setAudioBlocked] = useState(false);

            // Função precisa de sincronização (seekTo + play/pause)
            const syncTo = useCallback((targetTime, targetIsPlaying) => {
                const player = ytPlayerRef.current;
                if (!player || !isReadyRef.current) return;

                try {
                    const currentTime = typeof player.getCurrentTime === 'function' ? player.getCurrentTime() : 0;
                    const playerState = typeof player.getPlayerState === 'function' ? player.getPlayerState() : -1;
                    const drift = Math.abs(currentTime - targetTime);

                    // Se houver um desvio maior que 1.5s, reposiciona a agulha no segundo exato
                    if (drift > 1.5) {
                        console.log(`[Resync] Ajustando player: local ${currentTime.toFixed(1)}s -> servidor ${targetTime.toFixed(1)}s (desvio: ${drift.toFixed(1)}s)`);
                        player.seekTo(targetTime, true);
                    }

                    // Sincroniza o estado de reprodução (1 = PLAYING, 2 = PAUSED)
                    if (targetIsPlaying) {
                        if (playerState !== 1) {
                            const p = player.playVideo();
                            if (p && typeof p.catch === 'function') {
                                p.catch(() => setAudioBlocked(true));
                            }
                        }
                    } else {
                        if (playerState === 1) {
                            player.pauseVideo();
                        }
                    }
                } catch (err) {
                    console.warn('[Sync] Falha na sincronização do player:', err);
                }
            }, []);

            // Registra o manipulador de sincronização para ser acionado por visibilitychange e eventos de socket
            useEffect(() => {
                if (onRegisterSync) {
                    onRegisterSync(syncTo);
                }
            }, [onRegisterSync, syncTo]);

            // Inicialização do Player com a YouTube IFrame API
            useEffect(() => {
                if (!currentTrack || !currentTrack.id) {
                    if (ytPlayerRef.current && typeof ytPlayerRef.current.destroy === 'function') {
                        try { ytPlayerRef.current.destroy(); } catch (e) {}
                        ytPlayerRef.current = null;
                        isReadyRef.current = false;
                    }
                    return;
                }

                let isMounted = true;
                isReadyRef.current = false;

                const initPlayer = () => {
                    if (!isMounted) return;

                    if (!window.YT || !window.YT.Player) {
                        setTimeout(initPlayer, 200);
                        return;
                    }

                    if (playerContainerRef.current) {
                        playerContainerRef.current.innerHTML = '<div id="yt-player-target" class="w-full h-full"></div>';
                    }

                    try {
                        ytPlayerRef.current = new window.YT.Player('yt-player-target', {
                            videoId: currentTrack.id,
                            width: '100%',
                            height: '100%',
                            playerVars: {
                                autoplay: 1,
                                // Ouvintes não recebem controles nativos nem atalhos de teclado do YouTube
                                controls: isCurrentDj ? 1 : 0,
                                disablekb: isCurrentDj ? 0 : 1,
                                fs: isCurrentDj ? 1 : 0,
                                enablejsapi: 1,
                                playsinline: 1,
                                rel: 0,
                                modestbranding: 1,
                                origin: window.location.origin
                            },
                            events: {
                                onReady: (e) => {
                                    if (!isMounted) return;
                                    isReadyRef.current = true;
                                    console.log('[Player] YouTube Player carregado e pronto.');

                                    // Solicita imediatamente a posição e estado da sala ao carregar
                                    socket.emit('request_sync');

                                    try {
                                        if (isPlaying) {
                                            e.target.playVideo();
                                        } else {
                                            e.target.pauseVideo();
                                        }
                                    } catch (err) {
                                        setAudioBlocked(true);
                                    }
                                },
                                onStateChange: (e) => {
                                    // 0 = YT.PlayerState.ENDED
                                    if (e.data === 0) {
                                        console.log('[Player] Música finalizada.');
                                        if (onTrackEnded) onTrackEnded();
                                    }
                                },
                                onError: (err) => {
                                    console.warn('[Player] Erro no player do YouTube:', err);
                                }
                            }
                        });
                    } catch (e) {
                        console.error('[Player] Erro ao instanciar YT.Player:', e);
                    }
                };

                initPlayer();

                return () => {
                    isMounted = false;
                    isReadyRef.current = false;
                    if (ytPlayerRef.current && typeof ytPlayerRef.current.destroy === 'function') {
                        try {
                            ytPlayerRef.current.destroy();
                        } catch (e) {}
                        ytPlayerRef.current = null;
                    }
                };
            }, [currentTrack?.id, isCurrentDj]);

            // Desbloqueia áudio caso o navegador móvel restrinja autoplay
            const handleUnlockAudio = () => {
                setAudioBlocked(false);
                if (ytPlayerRef.current) {
                    try {
                        ytPlayerRef.current.unMute();
                        ytPlayerRef.current.playVideo();
                        socket.emit('request_sync');
                    } catch (e) {}
                }
            };

            if (!currentTrack) {
                return (
                    <div className="text-center text-gray-500 p-4">
                        <div className="text-3xl mb-2">📻</div>
                        <p className="text-lg font-bold text-gray-300">Nenhum DJ tocando agora</p>
                        <p className="text-xs text-gray-500">Adicione suas músicas e entre na fila para assumir a mesa!</p>
                    </div>
                );
            }

            return (
                <div className="relative w-full h-full">
                    {/* Alvo do Player do YouTube */}
                    <div ref={playerContainerRef} className="w-full h-full"></div>

                    {/* CAMADA DE PROTEÇÃO CONTRA CLIQUES DE OUVINTES (Requisito 1) */}
                    {!isCurrentDj && (
                        <div
                            className="absolute inset-0 z-10 bg-transparent cursor-default select-none"
                            title="Reprodução sincronizada. Apenas o DJ atual pode pausar ou alterar o vídeo."
                            onClick={(e) => {
                                e.preventDefault();
                                e.stopPropagation();
                            }}
                        />
                    )}

                    {/* Aviso de desbloqueio de áudio em celulares */}
                    {audioBlocked && (
                        <div className="absolute inset-0 z-20 flex items-center justify-center bg-black/75 p-4">
                            <button
                                onClick={handleUnlockAudio}
                                className="bg-pink-600 hover:bg-pink-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg shadow-pink-600/40 animate-pulse flex items-center gap-2 text-sm transition"
                            >
                                🔊 Toque para Ativar o Áudio da Sala
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // =========================================================================
        // APLICAÇÃO PRINCIPAL
        // =========================================================================
        function App() {
            const [isConnected, setIsConnected] = useState(socket.connected);
            const [user, setUser] = useState(null);
            const [nameInput, setNameInput] = useState('');
            const [roomState, setRoomState] = useState({ djQueue: [], messages: [], votes: { woot: 0, meh: 0 }, isPlaying: false, currentTime: 0 });
            const [inputMsg, setInputMsg] = useState('');
            const [playlist, setPlaylist] = useState([]);
            const [videoUrl, setVideoUrl] = useState('');
            const [isAddingTrack, setIsAddingTrack] = useState(false);
            const [mobileTab, setMobileTab] = useState('sala'); // 'sala' ou 'chat'
            const [unreadCount, setUnreadCount] = useState(0);

            const chatEndRef = useRef(null);
            const mobileTabRef = useRef('sala');
            mobileTabRef.current = mobileTab;

            // Ref para a função de sincronização do player ativo
            const syncPlayerFnRef = useRef(null);

            const handleRegisterSync = useCallback((syncFn) => {
                syncPlayerFnRef.current = syncFn;
            }, []);

            // Carrega dados salvos no localStorage (nome e playlist)
            useEffect(() => {
                const savedName = localStorage.getItem('vibedj_user_name');
                if (savedName) setNameInput(savedName);

                try {
                    const savedPlaylist = localStorage.getItem('vibedj_playlist');
                    if (savedPlaylist) {
                        const parsed = JSON.parse(savedPlaylist);
                        if (Array.isArray(parsed)) setPlaylist(parsed);
                    }
                } catch (e) {
                    console.error("Erro ao carregar playlist salva:", e);
                }
            }, []);

            // Gerencia eventos de conexão e atualização do Socket.IO
            useEffect(() => {
                const onConnect = () => {
                    console.log('[VibeDJ] Conectado ao servidor! Socket ID:', socket.id);
                    setIsConnected(true);

                    // Reautentica automaticamente na reconexão
                    const savedName = localStorage.getItem('vibedj_user_name');
                    if (savedName) {
                        socket.emit('set_user', { name: savedName, avatar: '🎧' });
                    }
                    socket.emit('request_sync');
                };

                const onDisconnect = (reason) => {
                    console.warn('[VibeDJ] Desconectado do servidor:', reason);
                    setIsConnected(false);
                };

                const onConnectError = (error) => {
                    console.error('[VibeDJ] Erro de conexão:', error);
                    setIsConnected(false);
                };

                const onInitState = (state) => {
                    setRoomState(state);
                    if (syncPlayerFnRef.current && state.currentTrack) {
                        syncPlayerFnRef.current(state.currentTime || 0, state.isPlaying);
                    }
                };

                const onUpdateRoom = (state) => {
                    setRoomState(state);
                };

                const onUpdateVotes = (votes) => {
                    setRoomState(prev => ({ ...prev, votes }));
                };

                const onNewMessage = (msg) => {
                    setRoomState(prev => ({ ...prev, messages: [...prev.messages, msg] }));
                    if (mobileTabRef.current !== 'chat') {
                        setUnreadCount(prev => prev + 1);
                    }
                };

                const onUserRegistered = (u) => {
                    setUser(u);
                    localStorage.setItem('vibedj_user_name', u.name);
                };

                // Resposta de sincronização recebida do servidor
                const onSyncTime = (data) => {
                    console.log('[Sync] Resposta de tempo recebida:', data);
                    if (syncPlayerFnRef.current) {
                        syncPlayerFnRef.current(data.currentTime, data.isPlaying);
                    }
                };

                // Comando de controle imediato disparado pelo DJ (play/pause/seek)
                const onPlayerAction = (data) => {
                    console.log('[PlayerAction] Ação executada pelo DJ:', data);
                    setRoomState(prev => ({ ...prev, isPlaying: data.isPlaying, currentTime: data.currentTime }));
                    if (syncPlayerFnRef.current) {
                        syncPlayerFnRef.current(data.currentTime, data.isPlaying);
                    }
                };

                socket.on('connect', onConnect);
                socket.on('disconnect', onDisconnect);
                socket.on('connect_error', onConnectError);
                socket.on('init_state', onInitState);
                socket.on('update_room', onUpdateRoom);
                socket.on('update_votes', onUpdateVotes);
                socket.on('new_message', onNewMessage);
                socket.on('user_registered', onUserRegistered);
                socket.on('sync_time', onSyncTime);
                socket.on('player_action', onPlayerAction);

                if (socket.connected) {
                    onConnect();
                }

                return () => {
                    socket.off('connect', onConnect);
                    socket.off('disconnect', onDisconnect);
                    socket.off('connect_error', onConnectError);
                    socket.off('init_state', onInitState);
                    socket.off('update_room', onUpdateRoom);
                    socket.off('update_votes', onUpdateVotes);
                    socket.off('new_message', onNewMessage);
                    socket.off('user_registered', onUserRegistered);
                    socket.off('sync_time', onSyncTime);
                    socket.off('player_action', onPlayerAction);
                };
            }, []);

            // =========================================================================
            // SINCRONIZAÇÃO EM TEMPO REAL: VISIBILITYCHANGE E FOCO DE TELA (Requisito 2)
            // =========================================================================
            useEffect(() => {
                const handleVisibilityChange = () => {
                    // Quando o usuário volta ao browser após alternar para WhatsApp ou outro app
                    if (document.visibilityState === 'visible') {
                        console.log('[Visibilidade] Usuário retornou à aba. Solicitando sincronização imediata...');
                        socket.emit('request_sync');
                    }
                };

                const handleWindowFocus = () => {
                    console.log('[Foco] Janela em foco. Solicitando ressincronização...');
                    socket.emit('request_sync');
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('focus', handleWindowFocus);

                // Polling suave de verificação de drift a cada 5 segundos
                const intervalId = setInterval(() => {
                    if (document.visibilityState === 'visible') {
                        socket.emit('request_sync');
                    }
                }, 5000);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('focus', handleWindowFocus);
                    clearInterval(intervalId);
                };
            }, []);

            // Scroll automático no chat
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [roomState.messages, mobileTab]);

            const handleSwitchTab = (tab) => {
                setMobileTab(tab);
                if (tab === 'chat') {
                    setUnreadCount(0);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanName = nameInput.trim();
                if (!cleanName) return;

                localStorage.setItem('vibedj_user_name', cleanName);
                setUser({ name: cleanName, avatar: '🎧', id: socket.id });
                socket.emit('set_user', { name: cleanName, avatar: '🎧' });
            };

            const handleLogout = () => {
                localStorage.removeItem('vibedj_user_name');
                setUser(null);
            };

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!inputMsg.trim()) return;
                socket.emit('send_message', {
                    text: inputMsg,
                    userName: user?.name,
                    userAvatar: user?.avatar || '🎧'
                });
                setInputMsg('');
            };

            const handleAddSong = async (e) => {
                e.preventDefault();
                if (!videoUrl || isAddingTrack) return;

                const videoId = extractVideoId(videoUrl);
                if (!videoId) {
                    alert('URL do YouTube inválida! Por favor, cole um link de vídeo ou Shorts válido.');
                    return;
                }

                setIsAddingTrack(true);
                let title = `Vídeo (${videoId})`;

                try {
                    const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.title) {
                            title = data.title;
                        }
                    }
                } catch (err) {
                    console.warn("Falha ao obter título do vídeo:", err);
                } finally {
                    setIsAddingTrack(false);
                }

                const newPlaylist = [...playlist, { id: videoId, title }];
                setPlaylist(newPlaylist);
                localStorage.setItem('vibedj_playlist', JSON.stringify(newPlaylist));
                socket.emit('update_playlist', newPlaylist);
                setVideoUrl('');
            };

            const handleRemoveSong = (indexToRemove) => {
                const newPlaylist = playlist.filter((_, idx) => idx !== indexToRemove);
                setPlaylist(newPlaylist);
                localStorage.setItem('vibedj_playlist', JSON.stringify(newPlaylist));
                socket.emit('update_playlist', newPlaylist);
            };

            const handleToggleQueue = () => {
                socket.emit('toggle_queue', playlist);
            };

            const handleTrackEnded = () => {
                socket.emit('track_ended');
            };

            // Tela de Login
            if (!user) {
                return (
                    <div className="flex flex-col min-h-screen items-center justify-center bg-gray-950 p-4">
                        <div className="mb-4">
                            {isConnected ? (
                                <span className="inline-flex items-center gap-2 text-xs font-semibold px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Servidor Conectado
                                </span>
                            ) : (
                                <span className="inline-flex items-center gap-2 text-xs font-semibold px-3 py-1 rounded-full bg-amber-950 text-amber-400 border border-amber-800">
                                    <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                                    Conectando ao servidor na nuvem...
                                </span>
                            )}
                        </div>

                        <form onSubmit={handleLogin} className="bg-gray-900 p-8 rounded-2xl neon-border text-center max-w-sm w-full">
                            <div className="text-4xl mb-2">🎧</div>
                            <h1 className="text-3xl font-black text-pink-500 mb-1 tracking-wider">VIBEDJ</h1>
                            <p className="text-xs text-gray-400 mb-6">Música em sincronia com seus amigos</p>

                            <input
                                type="text"
                                placeholder="Seu Nickname..."
                                value={nameInput}
                                onChange={(e) => setNameInput(e.target.value)}
                                maxLength={25}
                                className="w-full bg-gray-800 border border-gray-700 p-3 rounded-lg text-white mb-4 outline-none focus:border-pink-500 transition"
                            />
                            <button
                                type="submit"
                                className="w-full bg-pink-600 hover:bg-pink-500 font-bold p-3 rounded-lg transition active:scale-95 shadow-lg shadow-pink-600/30"
                            >
                                Entrar na Sala
                            </button>
                        </form>

                        {!isConnected && (
                            <p className="mt-4 text-xs text-gray-500 text-center max-w-xs">
                                💡 Dica: Se o servidor na Render estiver acordando do repouso, pode levar cerca de 30 segundos para conectar.
                            </p>
                        )}
                    </div>
                );
            }

            const isDjInQueue = roomState.djQueue.some(dj => dj.name === user.name || dj.id === user.id);
            const isCurrentDj = (roomState.currentDj?.name === user.name) || (roomState.currentDj?.id === user.id);

            return (
                <div className="flex flex-col h-screen bg-gray-950 text-white overflow-hidden">
                    {/* Header */}
                    <header className="h-14 bg-gray-900 border-b border-gray-800 px-4 flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-3">
                            <span className="text-pink-500 font-black text-lg tracking-wider flex items-center gap-1.5">
                                🎧 VIBEDJ
                            </span>
                            <div className="hidden sm:flex items-center gap-1.5 text-xs text-gray-400 bg-gray-800/80 px-2.5 py-1 rounded-full">
                                <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-500' : 'bg-amber-500 animate-ping'}`}></span>
                                {isConnected ? 'Online' : 'Reconectando...'}
                            </div>
                        </div>

                        {/* Abas no Celular */}
                        <div className="flex lg:hidden bg-gray-800 p-1 rounded-lg text-xs font-bold">
                            <button
                                onClick={() => handleSwitchTab('sala')}
                                className={`px-3 py-1.5 rounded-md transition ${mobileTab === 'sala' ? 'bg-pink-600 text-white' : 'text-gray-400'}`}
                            >
                                📺 Sala & Fila
                            </button>
                            <button
                                onClick={() => handleSwitchTab('chat')}
                                className={`px-3 py-1.5 rounded-md transition relative ${mobileTab === 'chat' ? 'bg-pink-600 text-white' : 'text-gray-400'}`}
                            >
                                💬 Chat
                                {unreadCount > 0 && (
                                    <span className="ml-1 bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full">
                                        {unreadCount}
                                    </span>
                                )}
                            </button>
                        </div>

                        {/* Usuário e Logout */}
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-semibold text-gray-300 hidden sm:inline">
                                {user.name} {isCurrentDj && <span className="text-pink-400 font-bold">(DJ da Vez)</span>}
                            </span>
                            <button
                                onClick={handleLogout}
                                title="Trocar de Nickname"
                                className="text-xs text-gray-400 hover:text-red-400 bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded transition"
                            >
                                Sair
                            </button>
                        </div>
                    </header>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">

                        {/* Área Principal: Player, Votos e Filas */}
                        <div className={`flex-1 flex-col p-3 md:p-4 gap-4 overflow-y-auto custom-scroll ${mobileTab === 'sala' ? 'flex' : 'hidden lg:flex'}`}>

                            {/* Player de Vídeo com Sincronização */}
                            <div className="relative aspect-video w-full max-h-[48vh] bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800 flex items-center justify-center shrink-0">
                                <VideoPlayer
                                    currentTrack={roomState.currentTrack}
                                    isPlaying={roomState.isPlaying}
                                    isCurrentDj={isCurrentDj}
                                    onTrackEnded={handleTrackEnded}
                                    onRegisterSync={handleRegisterSync}
                                />
                            </div>

                            {/* Barra de Status e Controles Exclusivos do DJ (Requisito 1) */}
                            <div className="bg-gray-900 p-3.5 rounded-xl flex flex-wrap items-center justify-between gap-3 border border-gray-800 shrink-0">
                                <div className="min-w-[150px]">
                                    <div className="flex items-center gap-2 mb-0.5">
                                        <p className="text-[10px] text-pink-400 font-bold uppercase tracking-wider">Tocando Agora</p>
                                        {roomState.currentTrack && (
                                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 ${
                                                roomState.isPlaying 
                                                    ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' 
                                                    : 'bg-amber-950 text-amber-400 border border-amber-800'
                                            }`}>
                                                <span className={`w-1.5 h-1.5 rounded-full ${roomState.isPlaying ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                                                {roomState.isPlaying ? 'Ao Vivo' : 'Pausado pelo DJ'}
                                            </span>
                                        )}
                                    </div>
                                    <p className="font-bold text-sm sm:text-base truncate max-w-xs sm:max-w-md">
                                        {roomState.currentTrack?.title || 'Silêncio na Sala'}
                                    </p>
                                    <p className="text-xs text-gray-400">
                                        DJ: <span className="text-white font-medium">{roomState.currentDj?.name || 'Ninguém'}</span>
                                    </p>
                                </div>

                                <div className="flex items-center gap-2 flex-wrap">
                                    {/* CONTROLES EXCLUSIVOS DO DJ ATUAL (Requisito 1) */}
                                    {isCurrentDj && roomState.currentTrack && (
                                        <div className="flex items-center gap-1.5 bg-gray-800/80 p-1 rounded-lg border border-pink-500/40">
                                            {/* Botão de Play / Pause sincronizado */}
                                            {roomState.isPlaying ? (
                                                <button
                                                    onClick={() => socket.emit('dj_pause')}
                                                    title="Pausar para toda a sala"
                                                    className="bg-amber-600 hover:bg-amber-500 active:scale-95 px-3 py-1.5 rounded-md font-bold text-xs flex items-center gap-1 transition shadow"
                                                >
                                                    ⏸️ Pausar
                                                </button>
                                            ) : (
                                                <button
                                                    onClick={() => socket.emit('dj_play')}
                                                    title="Tocar para toda a sala"
                                                    className="bg-emerald-600 hover:bg-emerald-500 active:scale-95 px-3 py-1.5 rounded-md font-bold text-xs flex items-center gap-1 transition shadow"
                                                >
                                                    ▶️ Play
                                                </button>
                                            )}

                                            {/* Pular para a próxima música */}
                                            <button
                                                onClick={() => socket.emit('skip_track')}
                                                title="Pular faixa"
                                                className="bg-rose-600 hover:bg-rose-500 active:scale-95 px-3 py-1.5 rounded-md font-bold text-xs flex items-center gap-1 transition shadow"
                                            >
                                                ⏭️ Pular
                                            </button>
                                        </div>
                                    )}

                                    {/* Botões de Votação (Para todos os participantes) */}
                                    <button
                                        onClick={() => socket.emit('vote', 'woot')}
                                        className="bg-emerald-600 hover:bg-emerald-500 active:scale-95 px-3.5 py-2 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1.5 transition shadow"
                                    >
                                        👍 Woot ({roomState.votes?.woot || 0})
                                    </button>
                                    <button
                                        onClick={() => socket.emit('vote', 'meh')}
                                        className="bg-rose-600 hover:bg-rose-500 active:scale-95 px-3.5 py-2 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1.5 transition shadow"
                                    >
                                        👎 Meh ({roomState.votes?.meh || 0})
                                    </button>
                                </div>
                            </div>

                            {/* Colunas: Minhas Músicas & Fila de DJs */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 min-h-[220px] flex-1 pb-2">
                                {/* Painel Minhas Músicas */}
                                <div className="bg-gray-900 p-3.5 rounded-xl border border-gray-800 flex flex-col h-64 md:h-auto">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-bold text-pink-400 text-sm flex items-center gap-1.5">
                                            🎵 Minhas Músicas ({playlist.length})
                                        </h3>
                                    </div>
                                    <form onSubmit={handleAddSong} className="flex gap-2 mb-2.5">
                                        <input
                                            type="text"
                                            placeholder="Cole link do YouTube ou Shorts..."
                                            value={videoUrl}
                                            onChange={(e) => setVideoUrl(e.target.value)}
                                            disabled={isAddingTrack}
                                            className="flex-1 bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-lg text-xs outline-none focus:border-pink-500 transition disabled:opacity-50"
                                        />
                                        <button
                                            type="submit"
                                            disabled={isAddingTrack}
                                            className="bg-pink-600 hover:bg-pink-500 px-3 py-1.5 rounded-lg font-bold text-xs transition disabled:opacity-50"
                                        >
                                            {isAddingTrack ? 'Buscando...' : 'Add'}
                                        </button>
                                    </form>
                                    <div className="flex-1 overflow-y-auto custom-scroll space-y-1.5 pr-1">
                                        {playlist.length === 0 ? (
                                            <p className="text-gray-500 text-xs italic text-center py-6">
                                                Nenhuma música na sua playlist ainda.
                                            </p>
                                        ) : (
                                            playlist.map((track, idx) => (
                                                <div key={idx} className="bg-gray-800 hover:bg-gray-750 p-2 rounded-lg text-xs flex justify-between items-center group">
                                                    <span className="truncate pr-2 font-medium" title={track.title}>
                                                        {idx + 1}. {track.title}
                                                    </span>
                                                    <button
                                                        onClick={() => handleRemoveSong(idx)}
                                                        className="text-gray-500 hover:text-red-400 transition text-xs font-bold px-1"
                                                        title="Remover"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                {/* Painel Fila de DJs */}
                                <div className="bg-gray-900 p-3.5 rounded-xl border border-gray-800 flex flex-col h-64 md:h-auto">
                                    <div className="flex justify-between items-center mb-2.5">
                                        <h3 className="font-bold text-cyan-400 text-sm flex items-center gap-1.5">
                                            🎧 Fila de DJs ({roomState.djQueue.length})
                                        </h3>
                                        <button
                                            onClick={handleToggleQueue}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition shadow ${
                                                isDjInQueue ? 'bg-red-600 hover:bg-red-500' : 'bg-cyan-600 hover:bg-cyan-500'
                                            }`}
                                        >
                                            {isDjInQueue ? 'Sair da Fila' : 'Entrar na Fila'}
                                        </button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scroll space-y-1.5 pr-1">
                                        {roomState.djQueue.length === 0 ? (
                                            <p className="text-gray-500 text-xs italic text-center py-6">
                                                A fila está vazia. Seja o primeiro a tocar!
                                            </p>
                                        ) : (
                                            roomState.djQueue.map((dj, idx) => (
                                                <div
                                                    key={idx}
                                                    className={`p-2 rounded-lg text-xs flex justify-between items-center ${
                                                        dj.name === user.name ? 'bg-cyan-950/60 border border-cyan-800/60' : 'bg-gray-800'
                                                    }`}
                                                >
                                                    <span className="font-medium flex items-center gap-1.5">
                                                        <span>{dj.avatar || '🎧'}</span>
                                                        <span>{idx + 1}. {dj.name}</span>
                                                        {dj.name === user.name && <span className="text-[10px] text-cyan-400 font-bold">(Você)</span>}
                                                    </span>
                                                    <span className="text-gray-400 text-[11px]">{dj.playlist?.length || 0} músicas</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* Área do Chat */}
                        <div className={`w-full lg:w-80 lg:max-w-sm bg-gray-900 border-l border-gray-800 flex-col h-full ${mobileTab === 'chat' ? 'flex' : 'hidden lg:flex'}`}>
                            <div className="p-3 border-b border-gray-800 flex items-center justify-between shrink-0">
                                <h2 className="font-bold text-sm text-pink-400 flex items-center gap-2">
                                    💬 Chat da Sala
                                </h2>
                                <span className="text-[11px] text-gray-500">
                                    {roomState.messages.length} mensagens
                                </span>
                            </div>

                            {/* Lista de Mensagens */}
                            <div className="flex-1 p-3 overflow-y-auto custom-scroll space-y-2.5">
                                {roomState.messages.length === 0 ? (
                                    <p className="text-gray-500 text-xs text-center py-10 italic">
                                        Diga olá para a galera da sala! 👋
                                    </p>
                                ) : (
                                    roomState.messages.map((msg) => (
                                        <div key={msg.id} className="text-xs bg-gray-800/40 p-2 rounded-lg border border-gray-800/60">
                                            <div className="flex justify-between items-center mb-0.5">
                                                <span className="font-bold text-pink-400">
                                                    {msg.avatar || '🎧'} {msg.user}
                                                </span>
                                                <span className="text-[10px] text-gray-500">{msg.time}</span>
                                            </div>
                                            <span className="text-gray-200 break-words">{msg.text}</span>
                                        </div>
                                    ))
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            {/* Input do Chat */}
                            <form onSubmit={handleSendMessage} className="p-3 border-t border-gray-800 flex gap-2 shrink-0 bg-gray-900">
                                <input
                                    type="text"
                                    placeholder="Digite sua mensagem..."
                                    value={inputMsg}
                                    onChange={(e) => setInputMsg(e.target.value)}
                                    maxLength={300}
                                    className="flex-1 bg-gray-800 border border-gray-700 p-2 rounded-lg text-xs outline-none focus:border-pink-500 text-white transition"
                                />
                                <button
                                    type="submit"
                                    className="bg-pink-600 hover:bg-pink-500 px-3 py-2 rounded-lg text-xs font-bold transition shrink-0"
                                >
                                    Enviar
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
